<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    
    <title>Musify Pro | Premium Audio</title>
    
    <!-- PWA -->
    <link rel="manifest" href="manifest.json">
    <meta name="theme-color" content="#ff5500">
    
    <!-- Favicon (VERY IMPORTANT for PWA builder) -->
    <link rel="icon" type="image/png" sizes="32x32" href="logo.png">
    <link rel="icon" type="image/png" sizes="16x16" href="logo.png">
    <link rel="apple-touch-icon" sizes="180x180" href="logo.png">
    
    <!-- Fix deprecated + cross-platform support -->
    <meta name="mobile-web-app-capable" content="yes">
    
    <!-- iOS Support -->
    <meta name="apple-mobile-web-app-capable" content="yes">
    <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
    <meta name="apple-mobile-web-app-title" content="Musify Pro">

    <style>
        :root {
            --primary: #ff5500;
            --primary-light: #ff884d;
            --bg-dark: #0a0a0f;
            --glass: rgba(255, 255, 255, 0.06);
            --glass-border: rgba(255, 255, 255, 0.1);
            --text-main: #ffffff;
            --text-dim: #b3b3b3;
        }

        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
        }

        body {
            font-family: 'Inter', sans-serif;
            background: radial-gradient(circle at top right, #1a1a2e, #0a0a0f);
            color: var(--text-main);
            height: 100vh;
            overflow: hidden;
            display: flex;
        }

        /* --- Sidebar & Mobile Navigation --- */
        .sidebar {
            width: 320px;
            background: rgba(0, 0, 0, 0.6);
            backdrop-filter: blur(30px);
            border-right: 1px solid var(--glass-border);
            display: flex;
            flex-direction: column;
            padding: 30px 20px;
            z-index: 100;
            transition: transform 0.4s cubic-bezier(0.77, 0, 0.175, 1);
        }

        .menu-toggle {
            display: none;
            position: fixed;
            top: 20px;
            left: 20px;
            z-index: 110;
            background: var(--primary);
            border: none;
            color: white;
            padding: 10px;
            border-radius: 8px;
            cursor: pointer;
            animation: bounceIn 1s;
        }

        /* --- Animations --- */
        @keyframes fadeIn { from { opacity: 0; } to { opacity: 1; } }
        @keyframes slideUp { from { opacity: 0; transform: translateY(30px); } to { opacity: 1; transform: translateY(0); } }
        @keyframes pulseGlow { 0% { opacity: 0.15; } 50% { opacity: 0.3; } 100% { opacity: 0.15; } }
        @keyframes rotateMusic { from { transform: rotate(0deg); } to { transform: rotate(360deg); } }
        @keyframes float { 0% { transform: translateY(0px); } 50% { transform: translateY(-10px); } 100% { transform: translateY(0px); } }
        @keyframes bounceIn { 0% { transform: scale(0.3); opacity: 0; } 50% { transform: scale(1.05); } 70% { transform: scale(0.9); } 100% { transform: scale(1); opacity: 1; } }
        @keyframes shake { 0%, 100% { transform: translateX(0); } 25% { transform: translateX(-2px); } 75% { transform: translateX(2px); } }

        .brand {
            font-size: 24px;
            font-weight: 800;
            margin-bottom: 30px;
            display: flex;
            align-items: center;
            gap: 10px;
            animation: fadeIn 1s ease-in;
        }

        .brand span { animation: rotateMusic 4s linear infinite; display: inline-block; }

        .playlist-item {
            padding: 15px;
            margin-bottom: 8px;
            border-radius: 12px;
            cursor: pointer;
            transition: all 0.4s cubic-bezier(0.175, 0.885, 0.32, 1.275);
            border: 1px solid transparent;
            display: flex;
            align-items: center;
            gap: 10px;
            opacity: 0;
            animation: slideUp 0.5s forwards;
        }

        .playlist-item:hover {
            background: var(--glass);
            transform: scale(1.05) translateX(10px);
            border-color: var(--glass-border);
        }

        .playlist-item.active {
            background: linear-gradient(90deg, var(--primary), var(--primary-light));
            box-shadow: 0 10px 20px rgba(255, 85, 0, 0.3);
            animation: shake 0.5s ease-in-out;
        }

        .main-content {
            flex: 1;
            display: flex;
            flex-direction: column;
            justify-content: center;
            align-items: center;
            padding: 20px;
            position: relative;
            overflow-y: auto;
        }

        .glow {
            position: absolute;
            width: 50vw;
            height: 50vw;
            background: var(--primary);
            filter: blur(150px);
            border-radius: 50%;
            z-index: 0;
            animation: pulseGlow 4s infinite alternate;
        }

        .player-card {
            width: 100%;
            max-width: 800px;
            height: 800px;
            background: var(--glass);
            backdrop-filter: blur(40px);
            border: 1px solid var(--glass-border);
            border-radius: 30px;
            padding: 30px;
            box-shadow: 0 25px 50px rgba(0,0,0,0.5);
            z-index: 1;
            animation: bounceIn 0.8s cubic-bezier(0.68, -0.55, 0.265, 1.55);
        }

        iframe {
            border-radius: 20px;
            margin-bottom: 20px;
            transition: all 0.5s ease;
            filter: grayscale(20%);
        }

        .btn-ctrl {
            background: var(--glass);
            border: 1px solid var(--glass-border);
            color: white;
            font-size: 20px;
            cursor: pointer;
            width: 55px;
            height: 55px;
            border-radius: 50%;
            transition: all 0.3s;
        }
        #player {
    width: 80% !important; /* Shrink width so the zoom doesn't cut it off */
    height: 700px !important; /* Set a fixed height */
    transform: scale(1.50); /* This makes EVERYTHING (fonts/rows) 25% bigger */
    transform-origin: top center; /* Keeps it centered in your card */
    margin-top: 20px;
    border-radius: 15px;
    filter: contrast(1.1); /* Makes the text pop more */
}

/* Adjust the player-card to handle the overflow from the zoom */
.player-card {
    overflow: hidden; /* Prevents the zoomed player from leaking out */
    display: flex;
    flex-direction: column;
    align-items: center;
}

 /* Base style for Black & Shiny Neon buttons */
.btn-ctrl {
    position: relative;
    background: linear-gradient(145deg, #0f0f0f, #050505); /* Deep glossy black */
    border: 1px solid rgba(255, 85, 0, 0.3); /* Subtle neon border */
    color: var(--primary); /* Neon orange icon */
    font-size: 22px;
    cursor: pointer;
    width: 60px;
    height: 60px;
    border-radius: 50%;
    z-index: 1000; /* High priority to stay on top */
    
    /* The Glow Effect */
    box-shadow: 0 0 15px rgba(255, 85, 0, 0.2), 
                inset 0 0 10px rgba(255, 255, 255, 0.05);
    
    /* Shiny Glass Reflection */
    backdrop-filter: blur(10px);
    transition: all 0.4s cubic-bezier(0.175, 0.885, 0.32, 1.275);
    display: flex;
    justify-content: center;
    align-items: center;
}

/* Bigger Main Play Button */
.btn-main {
    width: 85px;
    height: 85px;
    font-size: 32px;
    background: #000;
    border: 2px solid var(--primary);
    box-shadow: 0 0 30px rgba(255, 85, 0, 0.5); /* Intense Glow */
}

/* Hover Animation: Shiny Pulse */
.btn-ctrl:hover {
    transform: scale(1.15) translateY(-5px);
    color: #fff;
    border-color: #fff;
    box-shadow: 0 0 40px rgba(255, 85, 0, 0.8), 
                0 0 10px #fff; /* White core neon glow */
    text-shadow: 0 0 10px var(--primary);
}

/* Active Click Effect */
.btn-ctrl:active {
    transform: scale(0.9);
}

        @media (max-width: 768px) {
            body { flex-direction: column; }
            .sidebar { position: fixed; left: 0; top: 0; height: 100%; transform: translateX(-100%); width: 280px; }
            .sidebar.open { transform: translateX(0); box-shadow: 20px 0 50px rgba(0,0,0,0.8); }
            .menu-toggle { display: block; }
            .main-content { padding-top: 80px; }
            .player-card { height: 800px; padding: 15px; border-radius: 20px; }
            iframe { height: 640px; }
        }

     
        .popup-overlay {
    position: fixed;
    top: 0;
    left: 0;
    width: 100%;
    height: 100%;
    background: rgba(0,0,0,0.7);
    backdrop-filter: blur(10px);
    display: flex;
    justify-content: center;
    align-items: center;
    opacity: 0;
    pointer-events: none;
    transition: 0.4s;
    z-index: 200;
}

.popup-overlay.active {
    opacity: 1;
    pointer-events: all;
}

.popup-box {
    background: linear-gradient(135deg, #1a0026, #ff2e88);
    padding: 25px;
    border-radius: 20px;
    width: 300px;
    text-align: center;
    color: white;
    transform: scale(0.7);
    opacity: 0;
    transition: 0.4s;
    box-shadow: 0 20px 50px rgba(0,0,0,0.6);
}

.popup-overlay.active .popup-box {
    transform: scale(1);
    opacity: 1;
}

.steps {
    margin: 15px 0;
    text-align: left;
    font-size: 14px;
    line-height: 1.6;
}

.close-btn {
    margin-top: 15px;
    padding: 10px 20px;
    border: none;
    border-radius: 20px;
    background: white;
    color: black;
    cursor: pointer;
    font-weight: bold;
    transition: 0.3s;
}

.close-btn:hover {
    transform: scale(1.1);
}
.premium-heading {
    /* 1. POSITIONING CONTROL */
    position: absolute; 
    top: 30px;    /* Change this to move it UP or DOWN */
    left: 53%;    /* Starts at the center */
    transform: translateX(-50%); /* Perfectly centers it horizontally */
    z-index: 1500; /* Ensures it stays above the player and sidebar */

    /* 2. STYLE & SHINE */
    font-size: 52px;
    font-weight: 900;
    text-transform: uppercase;
    letter-spacing: 6px;
    white-space: nowrap; /* Prevents it from breaking into two lines */
    
    /* Animated Gradient Background */
    background: linear-gradient(
        to right, 
        #ff5500 20%, 
        #ffffff 50%, 
        #ff5500 80%
    );
    background-size: 200% auto;
    -webkit-background-clip: text;
    -webkit-text-fill-color: transparent;
    animation: shine-animation 3s linear infinite;
    filter: drop-shadow(0 0 20px rgba(255, 85, 0, 0.5));
}

@keyframes shine-animation {
    to { background-position: 200% center; }
}
/* Mobile Responsive adjustment */
@media (max-width: 768px) {
    .premium-heading {
        font-size: 32px;
        letter-spacing: 2px;
    }
}
    </style>
</head>

<body>

    <button class="menu-toggle" onclick="toggleSidebar()">☰</button>

    <aside class="sidebar" id="sidebar">
        <div class="brand"><span>🎵</span> Musify Pro<br>Playlists</div>
        <div class="search-container" style="margin-bottom: 20px;">
            <input type="text" id="searchInput" placeholder="Search..." 
                   style="width:100%; padding:12px; border-radius:10px; background:var(--glass); border:1px solid var(--glass-border); color:white;"
                   oninput="searchPlaylist(this.value)">
        </div>
        <div id="playlistContainer"></div>
    </aside>
    <h1 class="premium-heading">Musify Pro+</h1>
    <main class="main-content">
        <div class="glow"></div>
        
        <button onclick="openInstallPopup()" 
    style="
        position: fixed;
        top: 140px; /* Adjust this to move it UP or DOWN */
        right: 25px; /* Adjust this to move it LEFT or RIGHT */
        z-index: 2000; /* Keeps it above the sidebar and player */
        background: linear-gradient(135deg, #ff2e88, #6a00ff);
        height: 50px;
        border: none;
        padding: 12px 25px;
        border-radius: 50px; /* Pill shape looks more premium */
        color: white;
        font-weight: 800;
        font-size: 14px;
        letter-spacing: 1px;
        text-transform: uppercase;
        cursor: pointer;
        box-shadow: 0 10px 30px rgba(255, 0, 150, 0.5);
        transition: all 0.4s cubic-bezier(0.175, 0.885, 0.32, 1.275);
    "
    onmouseover="this.style.transform='scale(1.1) translateY(-5px)'; this.style.boxShadow='0 15px 40px rgba(255, 0, 150, 0.7)';"
    onmouseout="this.style.transform='scale(1) translateY(0)'; this.style.boxShadow='0 10px 30px rgba(255, 0, 150, 0.5)';"
>
    📲 Install App
</button>
        <div class="player-card">
            
            <div style="text-align:center; margin-bottom:15px;">
         
            </div>
            
            <iframe 
    id="player"
    width="100%"
    height="800"
    scrolling="no"
    frameborder="no"
    allow="autoplay; encrypted-media">
</iframe>

            <div class="controls" style="display:flex; justify-content:center; align-items:center; gap:20px;">
                <button class="btn-ctrl" onclick="prev()">⏮</button>
                <button class="btn-ctrl btn-main" id="playBtn" onclick="togglePlay()">▶</button>
                <button class="btn-ctrl" onclick="next()">⏭</button>
            </div>
        </div>
    </main>


    <div id="installPopup" class="popup-overlay">
        <div class="popup-box">
            <h2>Install Musify Pro+</h2>
            <p>Follow these steps:</p>
    
            <div class="steps">
                <div>1️. Open this in <b>Chrome</b></div>
                <div>2️. Tap <b>⋮ (3 dots)</b> top right</div>
                <div>3️. Click <b>Add to Home Screen</b></div>
                <div>4️. Tap <b>Install App</b></div>
            </div>
    
            <button onclick="closeInstallPopup()" class="close-btn">Got it 👍</button>
        </div>
    </div>
    <script src="https://w.soundcloud.com/player/api.js"></script>
    <script>
        const playlists = [
            { name: "Aditya Soni 💎", url: "https://soundcloud.com/aditya-soni-937353955/sets/musify" },
            { name: "Spoorthik", url: "https://soundcloud.com/aditya-soni-937353955/sets/spoorthik" },
            { name: "Santosh", url: "https://soundcloud.com/aditya-soni-937353955/sets/musify-soni" },
            { name: "Sushanth", url: "https://soundcloud.com/aditya-soni-937353955/sets/bored-af" }
        ];

        let currentIndex = 0;
        let widget;
        const sidebar = document.getElementById("sidebar");

        function toggleSidebar() { sidebar.classList.toggle("open"); }

        function render(list) {
            const container = document.getElementById("playlistContainer");
            container.innerHTML = "";
            list.forEach((p, index) => {
                const div = document.createElement("div");
                div.className = `playlist-item ${playlists.indexOf(p) === currentIndex ? 'active' : ''}`;
                div.style.animationDelay = `${index * 0.1}s`;
                div.innerHTML = `<span>📂</span> ${p.name}`;
                div.onclick = () => {
                    currentIndex = playlists.indexOf(p);
                    loadPlaylist(p.url);
                    render(playlists);
                    if(window.innerWidth < 768) toggleSidebar();
                };
                container.appendChild(div);
            });
        }

        function loadPlaylist(url) {
            const iframe = document.getElementById("player");
            iframe.style.opacity = "0";
            
            // REMOVED visual=true to keep your ORIGINAL CLASSIC UI
            const playerUrl = `https://w.soundcloud.com/player/?url=${url}&color=%23ff5500&auto_play=false&hide_related=true&show_comments=false&show_user=true&show_reposts=false&show_teaser=false`;
            
            setTimeout(() => {
                iframe.src = playerUrl;
                iframe.onload = () => {
                    iframe.style.opacity = "1";
                    widget = SC.Widget(iframe);

                    widget.bind(SC.Widget.Events.READY, () => {
                        updateMediaSession();
                    });

                    widget.bind(SC.Widget.Events.PLAY, () => {
                        if ('mediaSession' in navigator) navigator.mediaSession.playbackState = "playing";
                    });

                    widget.bind(SC.Widget.Events.PAUSE, () => {
                        if ('mediaSession' in navigator) navigator.mediaSession.playbackState = "paused";
                    });
                };
            }, 300);
        }

        function updateMediaSession() {
            if ('mediaSession' in navigator) {
                navigator.mediaSession.metadata = new MediaMetadata({
                    title: 'Musify Pro Premium',
                    artist: 'Aditya Soni',
                    album: 'Live Stream',
                    artwork: [{ src: 'logo.png', sizes: '512x512', type: 'image/png' }]
                });

                navigator.mediaSession.setActionHandler('play', () => { widget.play(); });
                navigator.mediaSession.setActionHandler('pause', () => { widget.pause(); });
                navigator.mediaSession.setActionHandler('previoustrack', () => { prev(); });
                navigator.mediaSession.setActionHandler('nexttrack', () => { next(); });
            }
        }

        function searchPlaylist(q) {
            const filtered = playlists.filter(p => p.name.toLowerCase().includes(q.toLowerCase()));
            render(filtered);
        }
        function openInstallPopup() {
    document.getElementById("installPopup").classList.add("active");
}

function closeInstallPopup() {
    document.getElementById("installPopup").classList.remove("active");
}

        function togglePlay() {
    if(widget) {
        widget.play(); // force play after click
    }
}
        function next() { if(widget) widget.next(); }
        function prev() { if(widget) widget.prev(); }

        render(playlists);
        loadPlaylist(playlists[0].url);
    </script>
</body>
</html>
