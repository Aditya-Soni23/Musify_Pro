<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    
    <title>Musify Pro | Premium Audio</title>
    
    <!-- PWA -->
    <link rel="manifest" href="manifest.json">
    <meta name="theme-color" content="#ff5500">
    
    <!-- Favicon (VERY IMPORTANT for PWA builder) -->
    <link rel="icon" type="image/png" sizes="32x32" href="logo.png">
    <link rel="icon" type="image/png" sizes="16x16" href="logo.png">
    <link rel="apple-touch-icon" sizes="180x180" href="logo.png">
    
    <!-- Fix deprecated + cross-platform support -->
    <meta name="mobile-web-app-capable" content="yes">
    
    <!-- iOS Support -->
    <meta name="apple-mobile-web-app-capable" content="yes">
    <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
    <meta name="apple-mobile-web-app-title" content="Musify Pro">

    <style>
        :root {
            --primary: #ff5500;
            --primary-light: #ff884d;
            --bg-dark: #0a0a0f;
            --glass: rgba(255, 255, 255, 0.06);
            --glass-border: rgba(255, 255, 255, 0.1);
            --text-main: #ffffff;
            --text-dim: #b3b3b3;
        }

        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
        }

        body {
            font-family: 'Inter', sans-serif;
            background: radial-gradient(circle at top right, #1a1a2e, #0a0a0f);
            color: var(--text-main);
            height: 100vh;
            overflow: hidden;
            display: flex;
        }

        /* --- Sidebar & Mobile Navigation --- */
        .sidebar {
            width: 320px;
            background: rgba(0, 0, 0, 0.6);
            backdrop-filter: blur(30px);
            border-right: 1px solid var(--glass-border);
            display: flex;
            flex-direction: column;
            padding: 30px 20px;
            z-index: 100;
            transition: transform 0.4s cubic-bezier(0.77, 0, 0.175, 1);
        }

        .menu-toggle {
            display: none;
            position: fixed;
            top: 20px;
            left: 20px;
            z-index: 110;
            background: var(--primary);
            border: none;
            color: white;
            padding: 10px;
            border-radius: 8px;
            cursor: pointer;
            animation: bounceIn 1s;
        }

        /* --- Animations --- */
        @keyframes fadeIn { from { opacity: 0; } to { opacity: 1; } }
        @keyframes slideUp { from { opacity: 0; transform: translateY(30px); } to { opacity: 1; transform: translateY(0); } }
        @keyframes pulseGlow { 0% { opacity: 0.15; } 50% { opacity: 0.3; } 100% { opacity: 0.15; } }
        @keyframes rotateMusic { from { transform: rotate(0deg); } to { transform: rotate(360deg); } }
        @keyframes float { 0% { transform: translateY(0px); } 50% { transform: translateY(-10px); } 100% { transform: translateY(0px); } }
        @keyframes bounceIn { 0% { transform: scale(0.3); opacity: 0; } 50% { transform: scale(1.05); } 70% { transform: scale(0.9); } 100% { transform: scale(1); opacity: 1; } }
        @keyframes shake { 0%, 100% { transform: translateX(0); } 25% { transform: translateX(-2px); } 75% { transform: translateX(2px); } }

        .brand {
            font-size: 24px;
            font-weight: 800;
            margin-bottom: 30px;
            display: flex;
            align-items: center;
            gap: 10px;
            animation: fadeIn 1s ease-in;
        }

        .brand span { animation: rotateMusic 4s linear infinite; display: inline-block; }

        .playlist-item {
            padding: 15px;
            margin-bottom: 8px;
            border-radius: 12px;
            cursor: pointer;
            transition: all 0.4s cubic-bezier(0.175, 0.885, 0.32, 1.275);
            border: 1px solid transparent;
            display: flex;
            align-items: center;
            gap: 10px;
            opacity: 0;
            animation: slideUp 0.5s forwards;
        }

        .playlist-item:hover {
            background: var(--glass);
            transform: scale(1.05) translateX(10px);
            border-color: var(--glass-border);
        }

        .playlist-item.active {
            background: linear-gradient(90deg, var(--primary), var(--primary-light));
            box-shadow: 0 10px 20px rgba(255, 85, 0, 0.3);
            animation: shake 0.5s ease-in-out;
        }

        .main-content {
            flex: 1;
            display: flex;
            flex-direction: column;
            justify-content: center;
            align-items: center;
            padding: 20px;
            position: relative;
            overflow-y: auto;
        }

        .glow {
            position: absolute;
            width: 50vw;
            height: 50vw;
            background: var(--primary);
            filter: blur(150px);
            border-radius: 50%;
            z-index: 0;
            animation: pulseGlow 4s infinite alternate;
        }

        .player-card {
            width: 100%;
            max-width: 800px;
            height: 800px;
            background: var(--glass);
            backdrop-filter: blur(40px);
            border: 1px solid var(--glass-border);
            border-radius: 30px;
            padding: 30px;
            box-shadow: 0 25px 50px rgba(0,0,0,0.5);
            z-index: 1;
            animation: bounceIn 0.8s cubic-bezier(0.68, -0.55, 0.265, 1.55);
        }

        iframe {
            border-radius: 20px;
            margin-bottom: 20px;
            transition: all 0.5s ease;
            filter: grayscale(20%);
        }

        .btn-ctrl {
            background: var(--glass);
            border: 1px solid var(--glass-border);
            color: white;
            font-size: 20px;
            cursor: pointer;
            width: 55px;
            height: 55px;
            border-radius: 50%;
            transition: all 0.3s;
        }

        .btn-ctrl:hover {
            background: white;
            color: black;
            transform: rotate(10deg) scale(1.1);
        }

        .btn-main {
            width: 75px;
            height: 75px;
            background: var(--primary);
            font-size: 28px;
            border: none;
            animation: float 3s infinite ease-in-out;
        }

        @media (max-width: 768px) {
            body { flex-direction: column; }
            .sidebar { position: fixed; left: 0; top: 0; height: 100%; transform: translateX(-100%); width: 280px; }
            .sidebar.open { transform: translateX(0); box-shadow: 20px 0 50px rgba(0,0,0,0.8); }
            .menu-toggle { display: block; }
            .main-content { padding-top: 80px; }
            .player-card { height: 800px; padding: 15px; border-radius: 20px; }
            iframe { height: 640px; }
        }

        .custom-box {
            position: absolute;
            bottom: 110px;
            right: 35px;
            z-index: 99;
            width: 320px;
            height: 50px;
            resize: both; 
            overflow: hidden;
            background: var(--glass);
            backdrop-filter: blur(15px);
            border: 2px solid var(--primary);
            border-radius: 15px;
            padding: 20px;
            display: flex;
            align-items: center;
            justify-content: center;
            color: rgb(0, 0, 0);
            font-weight: bold;
            box-shadow: 0 10px 30px rgba(0,0,0,0.5);
            animation: bounceIn 1s ease-out;
        }

        .custom-box-2 { top: 95px; right: 35px; width: 120px; height: 50px; background: linear-gradient(135deg, #1a0026, #ff2e88); border-color: var(--primary-light); }
        .custom-box-2 img { width: 60px; height: 60px; object-fit: contain; }
    </style>
</head>

<body>

    <button class="menu-toggle" onclick="toggleSidebar()">☰</button>

    <aside class="sidebar" id="sidebar">
        <div class="brand"><span>🎵</span> Musify Pro<br>Playlists</div>
        <div class="search-container" style="margin-bottom: 20px;">
            <input type="text" id="searchInput" placeholder="Search..." 
                   style="width:100%; padding:12px; border-radius:10px; background:var(--glass); border:1px solid var(--glass-border); color:white;"
                   oninput="searchPlaylist(this.value)">
        </div>
        <div id="playlistContainer"></div>
    </aside>

    <main class="main-content">
        <div class="glow"></div>
        
        <div class="player-card">
            <div class="now-playing-label" style="text-align:center; color:var(--primary); font-size:10px; letter-spacing:2px; margin-bottom:15px;">STREAMING LIVE</div>
            
            <iframe 
    id="player"
    width="100%"
    height="800"
    scrolling="no"
    frameborder="no"
    allow="autoplay; encrypted-media">
</iframe>

            <div class="controls" style="display:flex; justify-content:center; align-items:center; gap:20px;">
                <button class="btn-ctrl" onclick="prev()">⏮</button>
                <button class="btn-ctrl btn-main" id="playBtn" onclick="togglePlay()">▶</button>
                <button class="btn-ctrl" onclick="next()">⏭</button>
            </div>
        </div>
    </main>

    <div class="custom-box">
        <span>Musify Pro +</span>
    </div>

    <div class="custom-box custom-box-2">
        <img src="logo.png" alt="logo">
    </div>

    <script src="https://w.soundcloud.com/player/api.js"></script>
    <script>
        const playlists = [
            { name: "Aditya Soni 💎", url: "https://soundcloud.com/aditya-soni-937353955/sets/musify" },
        ];

        let currentIndex = 0;
        let widget;
        const sidebar = document.getElementById("sidebar");

        function toggleSidebar() { sidebar.classList.toggle("open"); }

        function render(list) {
            const container = document.getElementById("playlistContainer");
            container.innerHTML = "";
            list.forEach((p, index) => {
                const div = document.createElement("div");
                div.className = `playlist-item ${playlists.indexOf(p) === currentIndex ? 'active' : ''}`;
                div.style.animationDelay = `${index * 0.1}s`;
                div.innerHTML = `<span>📂</span> ${p.name}`;
                div.onclick = () => {
                    currentIndex = playlists.indexOf(p);
                    loadPlaylist(p.url);
                    render(playlists);
                    if(window.innerWidth < 768) toggleSidebar();
                };
                container.appendChild(div);
            });
        }

        function loadPlaylist(url) {
            const iframe = document.getElementById("player");
            iframe.style.opacity = "0";
            
            // REMOVED visual=true to keep your ORIGINAL CLASSIC UI
            const playerUrl = `https://w.soundcloud.com/player/?url=${url}&color=%23ff5500&auto_play=false&hide_related=true&show_comments=false&show_user=true&show_reposts=false&show_teaser=false`;
            
            setTimeout(() => {
                iframe.src = playerUrl;
                iframe.onload = () => {
                    iframe.style.opacity = "1";
                    widget = SC.Widget(iframe);

                    widget.bind(SC.Widget.Events.READY, () => {
                        updateMediaSession();
                    });

                    widget.bind(SC.Widget.Events.PLAY, () => {
                        if ('mediaSession' in navigator) navigator.mediaSession.playbackState = "playing";
                    });

                    widget.bind(SC.Widget.Events.PAUSE, () => {
                        if ('mediaSession' in navigator) navigator.mediaSession.playbackState = "paused";
                    });
                };
            }, 300);
        }

        function updateMediaSession() {
            if ('mediaSession' in navigator) {
                navigator.mediaSession.metadata = new MediaMetadata({
                    title: 'Musify Pro Premium',
                    artist: 'Aditya Soni',
                    album: 'Live Stream',
                    artwork: [{ src: '/Musify_Pro/logo.png', sizes: '512x512', type: 'image/png' }]
                });

                navigator.mediaSession.setActionHandler('play', () => { widget.play(); });
                navigator.mediaSession.setActionHandler('pause', () => { widget.pause(); });
                navigator.mediaSession.setActionHandler('previoustrack', () => { prev(); });
                navigator.mediaSession.setActionHandler('nexttrack', () => { next(); });
            }
        }

        function searchPlaylist(q) {
            const filtered = playlists.filter(p => p.name.toLowerCase().includes(q.toLowerCase()));
            render(filtered);
        }

        function togglePlay() {
    if(widget) {
        widget.play(); // force play after click
    }
}
        function next() { if(widget) widget.next(); }
        function prev() { if(widget) widget.prev(); }

        render(playlists);
        loadPlaylist(playlists[0].url);
    </script>
</body>
</html>
